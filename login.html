<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4 text-center">Login</h2>

        <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">
        <input type="password" id="password" class="form-control mb-3" placeholder="Enter Password">

        <button id="loginBtn" class="btn btn-success w-100">Login</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/login.js"></script>

</body>
</html>
