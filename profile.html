<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="text-center mb-4">Profile</h2>

        <input type="number" id="age" class="form-control mb-3" placeholder="Enter Age">

        <input type="date" id="dob" class="form-control mb-3">

        <input type="text" id="contact" class="form-control mb-3" placeholder="Enter Contact">

        <textarea id="address" class="form-control mb-3" placeholder="Enter Address"></textarea>

        <button id="saveBtn" class="btn btn-primary w-100">
            Save / Update Profile
        </button>

        <button id="logoutBtn" class="btn btn-danger w-100 mt-3">
            Logout
        </button>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="js/profile.js"></script>

</body>
</html>
